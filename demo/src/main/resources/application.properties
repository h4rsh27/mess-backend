spring.application.name=smartmess

# ===== Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:3d9b8c1a2e4f5067a1b9c3e5d7f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Mail (disabled by default; set env vars to enable) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@smartmess.com}

# ===== Server =====
server.port=${PORT:8080}

# ===== Springdoc / Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method

# ===== Scheduling =====
spring.task.scheduling.pool.size=5

# ===== Logging =====
logging.level.com.smartmess=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== Meal lifecycle =====
app.qr.secret=${QR_SECRET:SmartMessQrSecretKey_2026}
app.qr.refresh-minutes=${QR_REFRESH_MINUTES:2}
app.meal.cutoff-minutes=${MEAL_CUTOFF_MINUTES:120}
app.meal.grace-minutes=${MEAL_GRACE_MINUTES:20}
app.wallet.low-balance-threshold=${WALLET_LOW_BALANCE_THRESHOLD:300}