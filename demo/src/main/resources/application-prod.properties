# ===== Production Profile =====
# All values MUST be supplied via environment variables in production.

spring.jpa.show-sql=false

# Use 'update' so minor schema changes don't crash the app.
# Switch to 'validate' once schema is fully stable.
spring.jpa.hibernate.ddl-auto=update

# ===== Logging =====
logging.level.com.smartmess=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# ===== Swagger =====
# Keep Swagger ENABLED so the live API can be tested.
# To disable in prod, uncomment the two lines below:
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false
